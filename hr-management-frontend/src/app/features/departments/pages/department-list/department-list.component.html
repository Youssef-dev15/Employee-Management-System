<div class="page-header">
  <div>
    <h1>Departments</h1>
    <p class="muted">{{ departments.length }} department(s)</p>
  </div>
  <a class="btn btn-primary" routerLink="new">+ New department</a>
</div>

<div class="card card--flush">
  @if (loading) {
    <app-spinner></app-spinner>
  } @else if (departments.length === 0) {
    <div class="empty">No departments yet.</div>
  } @else {
    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th>Name</th>
            <th class="actions">Actions</th>
          </tr>
        </thead>
        <tbody>
          @for (department of departments; track department.departementId) {
            <tr>
              <td>{{ department.departementName }}</td>
              <td class="actions">
                <a class="btn btn-ghost btn-sm" [routerLink]="[department.departementId, 'edit']">Edit</a>
                <button type="button" class="btn-link-danger" (click)="askDelete(department)">Delete</button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>

<app-confirm-dialog
  [open]="!!toDelete"
  [busy]="deleting"
  title="Delete department"
  [message]="'Do you really want to delete « ' + (toDelete?.departementName ?? '') + ' »?'"
  (confirmed)="confirmDelete()"
  (cancelled)="cancelDelete()"
></app-confirm-dialog>
